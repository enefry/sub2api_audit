# This is an operator-applied example, not a complete nginx.conf.
# Keep the existing Sub2API proxy_pass directives in the /v1 location.

# Add these two directives inside the existing location that handles /v1:
#
#   mirror /_audit_ingest;
#   mirror_request_body on;

# The leading slash and exact match are required.
location = /_audit_ingest {
    internal;
    proxy_pass http://127.0.0.1:9203/_audit_ingest;
    proxy_pass_request_body on;

    proxy_set_header X-Audit-Proxy-Secret "REPLACE_WITH_THE_SAME_PROXY_SECRET";
    proxy_set_header X-Audit-Original-Method $request_method;
    proxy_set_header X-Audit-Original-URI $request_uri;
    proxy_set_header X-Audit-Original-Client-IP $remote_addr;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header API-Key $http_api_key;
    proxy_set_header X-Goog-API-Key $http_x_goog_api_key;

    proxy_connect_timeout 1s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location = /admin/audit {
    return 302 /admin/audit/;
}

location = /audit {
    return 302 /audit/;
}

location ^~ /admin/audit/ {
    # Use the same Authentik auth_request include as the protected Sub2API page.
    include /config/nginx/snippets/authentik-authrequest.conf;

    proxy_pass http://127.0.0.1:9203;
    proxy_http_version 1.1;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-authentik-username $authentik_username;
    proxy_set_header X-Audit-Proxy-Secret "REPLACE_WITH_THE_SAME_PROXY_SECRET";
}

location ^~ /audit/ {
    # Personal audit view. The application enforces username ownership in SQL.
    include /config/nginx/snippets/authentik-authrequest.conf;

    proxy_pass http://127.0.0.1:9203;
    proxy_http_version 1.1;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-authentik-username $authentik_username;
    proxy_set_header X-Audit-Proxy-Secret "REPLACE_WITH_THE_SAME_PROXY_SECRET";
}

# Ensure this virtual host does not use a log format containing
# $http_authorization. The built-in "combined" format does not contain it:
#
#   access_log /config/log/nginx/sub2api_access.log combined;
