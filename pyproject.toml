[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sub2api-recorder"
version = "0.1.0"
description = "Side-channel request audit recorder for Sub2API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "boto3==1.43.61",
  "cryptography==50.0.2",
  "fastapi==0.141.1",
  "ijson==3.5.1",
  "loguru==0.7.3",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "uvicorn[standard]==0.52.0",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
sub2api-recorder = "sub2api_recorder.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sub2api_recorder*"]

[tool.setuptools.package-data]
sub2api_recorder = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
